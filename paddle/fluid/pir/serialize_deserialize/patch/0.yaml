op_patches:
  - op_name : pd_op.max_pool2d_with_index
    actions:
      - action : modify_attr
        object : kernel_size
        type : pir::ArrayAttribute
        default :
          - type: pir::Int64Attribute
          - type: pir::Int64Attribute
      - action : modify_attr
        object : strides
        type : pir::ArrayAttribute
        default :
          - type: pir::Int64Attribute
          - type: pir::Int64Attribute
      - action : modify_attr
        object : paddings
        type : pir::ArrayAttribute
        default :
          - type: pir::Int64Attribute
          - type: pir::Int64Attribute

