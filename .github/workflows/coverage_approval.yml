name: Coverage Approval
run-name: Coverage Approval PR-${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  signal:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      (github.event.review.user.login == 'swgu98' || github.event.review.user.login == 'sneaxiy') &&
      contains(github.event.review.body, 'lgtm') &&
      contains(github.event.review.body, 'coverage')
    runs-on:
      group: APPROVAL
    steps:
      - name: Record coverage approval
        env:
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'Review state: %s\n' "${REVIEW_STATE}"
          printf 'Reviewer: %s\n' "${REVIEWER}"
          printf 'Pull request: %s\n' "${PR_NUMBER}"
          printf 'Head SHA: %s\n' "${HEAD_SHA}"
