name: DeepMD-Kit-PR-CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      PR_ID:
        required: false
        type: string
        description: "PR number for manual trigger"

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  clone:
    name: Clone PR code
    uses: ./.github/workflows/_Clone-linux.yml
    with:
      clone_dir: Paddle-build
      is_pr: "true"
      PR_ID: ${{ github.event.pull_request.number || inputs.PR_ID }}

  build-docker:
    name: Build docker image
    needs: clone
    uses: ./.github/workflows/docker.yml
    with:
      clone_dir: Paddle-build
      task: build

  build:
    name: Build Paddle
    needs: [clone, build-docker]
    uses: ./.github/workflows/_Linux-build.yml
    with:
      docker_build_image: ${{ needs.build-docker.outputs.docker_build_image }}
      is_pr: "true"
      PR_ID: ${{ github.event.pull_request.number || inputs.PR_ID }}

  deepmd-test:
    name: DeepMD-Kit Integration Test
    needs: [clone, build-docker, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-docker.outputs.docker_build_image }}

    steps:
      - name: Print PR information
        run: |
          echo "Testing PR #${{ github.event.pull_request.number || inputs.PR_ID }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Author: ${{ github.event.pull_request.user.login }}"

      - name: Checkout deepmd-kit repository
        run: |
          git clone https://github.com/HydrogenSulfate/deepmd-kit.git -b v3.1.2
          cd deepmd-kit

      - name: Install deepmd-kit dependencies
        run: |
          cd deepmd-kit
          DP_ENABLE_TENSORFLOW=0 DP_ENABLE_PYTORCH=0 pip install -v -e . -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Install pytest
        run: |
          pip install pytest pytest-xdist -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Run deepmd-kit pytest
        id: pytest_run
        run: |
          cd deepmd-kit
          echo "::group::Running pytest on source/tests/pd"
          pytest source/tests/pd -v --tb=long --color=yes 2>&1 | tee pytest_output.log
          TEST_RESULT=${PIPESTATUS[0]}
          echo "::endgroup::"
          exit $TEST_RESULT
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deepmd-test-results-pr-${{ github.event.pull_request.number || inputs.PR_ID }}
          path: deepmd-kit/pytest_output.log
          retention-days: 30

      - name: Check test status and report
        if: always()
        run: |
          cd deepmd-kit
          if [ -f pytest_output.log ]; then
            echo "==================================="
            echo "DeepMD-Kit Test Results Summary"
            echo "==================================="

            if pytest source/tests/pd -v --tb=line --no-header --quiet 2>&1 | grep -E "(PASSED|FAILED|ERROR)"; then
              echo ""
            fi

            if grep -q "FAILED\|ERROR" pytest_output.log; then
              echo ""
              echo "❌ Tests FAILED! Error details:"
              echo "==================================="
              cat pytest_output.log
              echo "==================================="
              exit 1
            else
              echo ""
              echo "✅ All tests PASSED!"
              exit 0
            fi
          else
            echo "❌ Test output file not found!"
            exit 1
          fi

      - name: Comment PR with test results
        if: always() && github.event_name == "pull_request"
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require("fs");
            const testResult = "${{ steps.pytest_run.outcome }}";
            const prNumber = context.issue.number;

            let comment = `## DeepMD-Kit Integration Test Results\n\n`;
            comment += `**PR**: #${prNumber}\n`;
            comment += `**Commit**: ${context.sha.substring(0, 7)}\n`;
            comment += `**Status**: ${testResult === "success" ? "✅ PASSED" : "❌ FAILED"}\n\n`;

            if (testResult !== "success") {
              comment += `### ⚠️ Test Failed\n`;
              comment += `Please check the [workflow logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for detailed error messages.\n\n`;
              comment += `Test artifacts are available for download in the workflow run page.\n`;
            } else {
              comment += `### ✅ All Tests Passed\n`;
              comment += `All deepmd-kit integration tests passed successfully!\n`;
            }

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
