name: Windows-GPU

on:
  workflow_call:

permissions: read-all

env:
  PR_ID: ${{ github.event.pull_request.number }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha }}
  BRANCH: ${{ github.base_ref }}
  ci_scripts: ${{ github.workspace }}\ci\windows
  WORKSPACE_DIR: ${{ github.workspace }}\..
  cache_dir: ${{ github.workspace }}\..\cache
  no_proxy: "bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"

defaults:
  run:
    shell: cmd

jobs:
  build:
    name: Build
    runs-on:
      group: win-gpu
    steps:
      - name: Download Paddle and config env
        working-directory: ..
        run: |
          cd
          rmdir /s/q %WORKSPACE_DIR%\Paddle 2>NUL
          echo "path=%path%;C:\Program Files\NVIDIA Corporation\NVSMI" >> %GITHUB_ENV%
          python -m pip install wget
          python -c "import wget;wget.download('https://paddle-github-action.bj.bcebos.com/PR/windows/%PR_ID%/%COMMIT_ID%/Paddle.tar.zst')"
          zstd -d Paddle.tar.zst && tar -xf Paddle.tar
          del Paddle.tar Paddle.tar.zst
          call %ci_scripts%\clean_env.bat

      - name: Build
        env:
          NIGHTLY_MODE: "OFF"
          WITH_UNITY_BUILD: "ON"
          WITH_TPCACHE: "ON"
          WITH_SCCACHE: "ON"
          WITH_SHARED_PHI: "OFF"
          GIT_PR_ID: ${{ github.event.pull_request.number }}
          WITH_TESTING: "ON"
          PRECISION_TEST: "OFF"
          PYTHON_ROOT: C:\Python310
          vcvars64_dir: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvars64.bat'
          CUDA_TOOLKIT_ROOT_DIR: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.0'
          TENSORRT_ROOT: D:\TensorRT
          CTEST_PARALLEL_LEVEL: 1
          GENERATOR: "Ninja"
        run: |
          call %ci_scripts%\config_env.bat

    # - name: Clean up dir
    #   if: always()
    #   run: |
    #     del /s /q %WORKSPACE_DIR%\Paddle
