on:
  workflow_call:
    outputs:
      docker_sot_image:
        description: "Generate images for all CI usage"
        value: ${{ jobs.build-docker-images.outputs.docker_sot_image }}

jobs:
  build-docker-images:
    name: build docker
    runs-on:
      group: Docker-build
    outputs:
      docker_sot_image: ${{ steps.build-docker-images.outputs.docker_sot_image }}
    steps:
      - id: build-docker-images
        name: build docker images
        env:
          PR_ID: ${{ github.event.pull_request.number }}
          COMMIT_ID: ${{ github.event.pull_request.head.sha }}
          docker_image_file: Dockerfile.cuda9_cudnn7_gcc48_py35_centos6
        run: |
          set -x
          wget -q --no-proxy https://paddle-github-action.bj.bcebos.com/PR/Paddle/${PR_ID}/${COMMIT_ID}/Paddle.tar.gz --no-check-certificate
          tar xf Paddle.tar.gz --strip-components=1
          rm Paddle.tar.gz
          cd tools/dockerfile
          bash ci_dockerfile.sh
          docker_sot_md5=`md5sum ${docker_image_file} |awk '{print $1}'`
          docker_sot_image=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/ci/paddle:${docker_md5}
          echo "docker_sot_image=${docker_sot_image}" >> $GITHUB_OUTPUT
          cd ../../

          set +e
          docker pull ${docker_sot_image}
          if [ $? -eq 0 ];then
            echo use docker cache
          else
            docker build -t $docker_sot_image -f tools/dockerfile/${docker_image_file} .
            docker push $docker_sot_image
            echo end docker build
          fi
          set -e

          cd ${{ github.workspace }}
          rm -rf ./*
