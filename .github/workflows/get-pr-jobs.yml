name: Get PR Jobs and Verify Mapping

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  get-jobs-and-verify-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed workflow files
        id: changed_workflows
        uses: tj-actions/changed-files@v44
        with:
          files: .github/workflows/**

      - name: Get all job names for the PR
        id: get_jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ID: ${{ github.event.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "Fetching jobs for PR #${PR_ID} with commit SHA ${COMMIT_SHA}"

          # The GitHub API can be slow to update.
          # We'll add a short delay and retry loop to ensure we get the workflow runs.
          echo "Waiting for workflow runs to be created..."
          sleep 30 # Initial delay

          all_job_names=""
          max_retries=5
          retry_count=0

          while [ $retry_count -lt $max_retries ]; do
            runs_response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$OWNER/$REPO/actions/runs?head_sha=$COMMIT_SHA&per_page=100")

            run_ids=$(echo "$runs_response" | jq -r '.workflow_runs[].id')

            if [ -n "$run_ids" ]; then
              for run_id in $run_ids; do
                jobs_response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$run_id/jobs?per_page=100")
                job_names=$(echo "$jobs_response" | jq -r '.jobs[].name')
                if [ -n "$job_names" ]; then
                  all_job_names="${all_job_names}${job_names}\n"
                fi
              done
              if [ -n "$all_job_names" ]; then
                break
              fi
            fi

            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "No runs found yet. Retrying in 30 seconds... (Attempt ${retry_count}/${max_retries})"
              sleep 30
            fi
          done

          echo "----------------------------------------"
          echo "           JOB NAMES FOUND"
          echo "----------------------------------------"
          if [ -z "$all_job_names" ]; then
            echo "::warning::No jobs found for commit $COMMIT_SHA after multiple retries."
            echo "all_jobs=''" >> $GITHUB_OUTPUT
          else
            unique_jobs=$(echo -e "$all_job_names" | sort -u)
            echo -e "$unique_jobs"
            # Store jobs for the next step
            echo "all_jobs<<EOF" >> $GITHUB_OUTPUT
            echo -e "$unique_jobs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          echo "----------------------------------------"

      - name: Verify rerun-mapping.json
        if: steps.changed_workflows.outputs.any_changed == 'true'
        run: |
          echo "Workflow files changed. Verifying .github/rerun-mapping.json..."

          actual_jobs="${{ steps.get_jobs.outputs.all_jobs }}"
          if [ -z "$actual_jobs" ]; then
            echo "::error::Could not retrieve actual job list. Cannot verify mapping."
            exit 1
          fi

          mapping_file=".github/rerun-mapping.json"
          if [ ! -f "$mapping_file" ]; then
            echo "::error::File $mapping_file not found."
            exit 1
          fi

          # Get all values from the JSON mapping, excluding "all-failed"
          mapped_jobs=$(jq -r 'del(.["all-failed"]) | .[]' "$mapping_file")

          error_found=false
          for job in $mapped_jobs; do
            # Use grep with -x for exact line match
            if ! echo -e "$actual_jobs" | grep -qx "$job"; then
              echo "::error::Stale job name in $mapping_file: '$job' is no longer a valid job name."
              error_found=true
            fi
          done

          if [ "$error_found" = true ]; then
            echo "Please update .github/rerun-mapping.json to match the new workflow configuration."
            exit 1
          else
            echo "Success! All job names in .github/rerun-mapping.json are valid."
          fi
