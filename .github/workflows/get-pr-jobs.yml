name: Get PR Jobs and Verify Mapping

on:
  pull_request:
    types: [opened, synchronize]
    branches: develop
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

jobs:
  get-jobs-and-verify-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install python dependencies
        run: pip install git+https://github.com/ooooo-create/actions-job-parser.git

      - name: Get all job names from workflow files
        id: get_jobs
        run: |
          # 将 job 名称输出到一个临时文件中
          ajp --repo-root . > all_jobs.txt

          echo "All job names found:"
          cat all_jobs.txt

          # 检查文件是否为空
          if [ ! -s all_jobs.txt ]; then
            echo "::error::No job names found in workflow files."
            exit 1
          fi

      - name: Verify rerun-mapping.json
        run: |
          echo "Workflow files changed. Verifying .github/rerun-mapping.json..."

          mapping_file=".github/rerun-mapping.json"
          if [ ! -f "$mapping_file" ]; then
            echo "::error::File $mapping_file not found."
            exit 1
          fi

          error_found=false
          # 从 mapping 文件中读取 job
          jq -r 'del(.["all-failed"]) | .[]' "$mapping_file" | while IFS= read -r job; do
            if [ -z "$job" ]; then
              continue
            fi

            # 在 all_jobs.txt 文件中精确匹配 job 名称
            if ! grep -qx -- "$job" all_jobs.txt; then
              echo "::error::Stale job name in $mapping_file: '$job' is no longer a valid job name."
              error_found=true
            fi
          done

          if [ "$error_found" = true ]; then
            echo "Please update .github/rerun-mapping.json to match the new workflow configuration."
            exit 1
          else
            echo "Success! All job names in .github/rerun-mapping.json are valid."
          fi
