name: Get PR Jobs and Verify Mapping

on:
  pull_request:
    types: [opened, synchronize]
    branches: develop
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

jobs:
  get-jobs-and-verify-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install python dependencies
        run: pip install git+https://github.com/ooooo-create/actions-job-parser.git

      - name: Get all job names from workflow files
        id: get_jobs
        run: |
          job_names=$(ajp --repo-root . --only-names)
          if [ -z "$job_names" ]; then
            echo "::error::No job names found in workflow files."
            exit 1
          fi
          echo "All job names:"
          echo "$job_names"
          {
            echo 'all_jobs<<EOF'
            echo "$job_names"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify rerun-mapping.json
        run: |
          echo "Workflow files changed. Verifying .github/rerun-mapping.json..."

          actual_jobs="${{ steps.get_jobs.outputs.all_jobs }}"
          if [ -z "$actual_jobs" ]; then
            echo "::error::Could not retrieve actual job list. Cannot verify mapping."
            exit 1
          fi

          mapping_file=".github/rerun-mapping.json"
          if [ ! -f "$mapping_file" ]; then
            echo "::error::File $mapping_file not found."
            exit 1
          fi

          error_found=false
          # 使用 while read 循环来逐行处理，避免词语分割问题
          jq -r 'del(.["all-failed"]) | .[]' "$mapping_file" | while IFS= read -r job; do
            # 跳过空行
            if [ -z "$job" ]; then
              continue
            fi

            # 使用 grep -qx 来精确匹配整行
            if ! echo -e "$actual_jobs" | grep -qx -- "$job"; then
              echo "::error::Stale job name in $mapping_file: '$job' is no longer a valid job name."
              error_found=true
            fi
          done

          if [ "$error_found" = true ]; then
            echo "Please update .github/rerun-mapping.json to match the new workflow configuration."
            exit 1
          else
            echo "Success! All job names in .github/rerun-mapping.json are valid."
          fi
