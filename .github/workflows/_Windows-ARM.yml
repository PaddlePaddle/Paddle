name: Windows ARM64

on:
  workflow_call:
    inputs:
      clone-can-skip:
        type: string
        required: false
        default: "false"

permissions: read-all

env:
  PR_ID: ${{ github.event.pull_request.number }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha }}
  BRANCH: ${{ github.base_ref }}
  ci_scripts: ${{ github.workspace }}\ci\windows
  ACTION_DIR: ${{ github.workspace }}\..\..\..
  WORKSPACE_DIR: ${{ github.workspace }}\..
  cache_dir: C:\action-cache
  SCCACHE_ROOT: C:\sccache
  no_proxy: "bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"

defaults:
  run:
    shell: cmd

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      PADDLE_VERSION: 0.0.0
      NIGHTLY_MODE: "OFF"
      WITH_ARM: "ON"
      WITH_GPU: "OFF"
      WITH_MKL: "OFF"
      WITH_AVX: "OFF"
      WITH_TENSORRT: "OFF"
      WITH_TESTING: "OFF"
      WITH_CPP_TEST: "OFF"
      WITH_ONNXRUNTIME: "OFF"
      WITH_INFERENCE_API_TEST: "OFF"
      WITH_UNITY_BUILD: "ON"
      WITH_SHARED_PHI: "ON"
      WITH_SCCACHE: "ON"
      WITH_CACHE: "OFF"
      WITH_TPCACHE: "OFF"
      MSVC_STATIC_CRT: "ON"
      ON_INFER: "OFF"
      GENERATOR: "Ninja"
      OPENBLAS_ROOT: C:\openblas
      OPENBLAS_URL: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.30/OpenBLAS-0.3.30-woa64-dll.zip"
      SKIP_SYNC_UPSTREAM: "ON"
      WIN_UNITTEST_LEVEL: 0
      CTEST_PARALLEL_LEVEL: 1
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Paddle and clean env
        working-directory: ..
        timeout-minutes: 30
        run: |
          whoami
          cd
          rmdir /s/q %WORKSPACE_DIR%\Paddle
          python -m pip install wget
          python -c "import wget;wget.download('https://paddle-github-action.bj.bcebos.com/windows/PR/%PR_ID%/%COMMIT_ID%/Paddle.tar.zst')"
          zstd -d Paddle.tar.zst && tar -xf Paddle.tar
          del Paddle.tar Paddle.tar.zst
          call %ci_scripts%\clean_env.bat

      - name: Clean env
        run: |
          call %ci_scripts%\clean_env.bat

      - name: Setup Python 3.11 ARM64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Set Python paths
        shell: cmd
        run: |
          echo PYTHON_ROOT=%pythonLocation%>> %GITHUB_ENV%

      - name: Configure OpenBLAS
        run: |
          set "root=%OPENBLAS_ROOT%"
          curl -L -o "%RUNNER_TEMP%\openblas-woa64.zip" "%OPENBLAS_URL%" || exit /b 1
          7z x "%RUNNER_TEMP%\openblas-woa64.zip" -o"%RUNNER_TEMP%\openblas-woa64" -y > NUL || exit /b 1
          xcopy "%RUNNER_TEMP%\openblas-woa64\OpenBLAS" "%root%\" /E /I /Y > NUL || exit /b 1

      - name: Config env
        run: |
          call %ci_scripts%\config_env.bat

      - name: Build paddle
        run: |
          python -m pip install bce-python-sdk==0.8.74
          call %ci_scripts%\build.bat

      - name: Test whl package
        run: |
          call %ci_scripts%\test_whl_package.bat

      - name: Clean up dir
        if: always()
        run: |
          call %ci_scripts%\clean_env.bat
